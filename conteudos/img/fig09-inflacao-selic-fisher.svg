<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="title-fig09 desc-fig09">
  <title id="title-fig09">Transmissão da Taxa Selic, Inflação e Equação de Fisher</title>
  <desc id="desc-fig09">Cadeia de transmissão da política monetária do Copom sobre crédito, demanda e inflação, junto à fórmula exata dos juros reais.</desc>
  <rect width="760" height="400" rx="12" fill="#FAF5EA" stroke="#D8C9AA" stroke-width="1.5"/>
  <rect x="0" y="0" width="760" height="48" rx="12" fill="#3C4459"/>
  <rect x="0" y="34" width="760" height="14" fill="#3C4459"/>
  <text x="24" y="30" font-family="Jura, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#F5E6C7">FIGURA 09 · TRANSMISSÃO MONETÁRIA (SELIC → IPCA) E JUROS REAIS</text>

  <!-- Step boxes top -->
  <rect x="26" y="72" width="160" height="94" rx="10" fill="#3C4459"/>
  <text x="106" y="99" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#E2BB7F">1. COPOM / BCB</text>
  <text x="106" y="119" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#F5E6C7">Define Taxa Selic Meta</text>
  <text x="106" y="135" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#F5E6C7">para ancorar IPCA</text>
  <text x="106" y="151" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#E2BB7F">Ex.: Aperto (Selic ↑)</text>

  <line x1="188" y1="119" x2="208" y2="119" stroke="#8B5E1A" stroke-width="3"/>
  <polygon points="214,119 205,114 205,124" fill="#8B5E1A"/>

  <rect x="216" y="72" width="160" height="94" rx="10" fill="#FFFFFF" stroke="#0D91D0" stroke-width="2"/>
  <text x="296" y="99" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#3C4459">2. CRÉDITO &amp; CDI</text>
  <text x="296" y="119" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#252B39">Encarece capital de giro,</text>
  <text x="296" y="135" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#252B39">parcelamentos e máquinas;</text>
  <text x="296" y="151" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#8B5E1A">Renda fixa mais atrativa</text>

  <line x1="378" y1="119" x2="398" y2="119" stroke="#8B5E1A" stroke-width="3"/>
  <polygon points="404,119 395,114 395,124" fill="#8B5E1A"/>

  <rect x="406" y="72" width="160" height="94" rx="10" fill="#FFFFFF" stroke="#3C4459" stroke-width="2"/>
  <text x="486" y="99" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#3C4459">3. DEMANDA (C + I)</text>
  <text x="486" y="119" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#252B39">Desacelera consumo a prazo</text>
  <text x="486" y="135" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#252B39">e posterga expansões</text>
  <text x="486" y="151" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#3C4459">Esfria pressão de preços</text>

  <line x1="568" y1="119" x2="588" y2="119" stroke="#8B5E1A" stroke-width="3"/>
  <polygon points="594,119 585,114 585,124" fill="#8B5E1A"/>

  <rect x="596" y="72" width="138" height="94" rx="10" fill="#252B39"/>
  <text x="665" y="99" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#E2BB7F">4. INFLAÇÃO</text>
  <text x="665" y="119" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#F5E6C7">Convergência gradual</text>
  <text x="665" y="135" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#F5E6C7">do IPCA à meta</text>
  <text x="665" y="151" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="10" fill="#E2BB7F">(defasagem de 3–6 trim.)</text>

  <!-- Bottom: Fisher Equation Panel -->
  <rect x="26" y="190" width="708" height="186" rx="10" fill="#FFFFFF" stroke="#D8C9AA" stroke-width="1.5"/>
  <rect x="26" y="190" width="708" height="36" rx="10" fill="#F5E6C7"/>
  <rect x="26" y="213" width="708" height="13" fill="#F5E6C7"/>
  <text x="44" y="214" font-family="Jura, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#3C4459">EQUAÇÃO DE FISHER — NÃO CONFUNDA JURO NOMINAL (i) COM JURO REAL (r)</text>

  <rect x="44" y="242" width="330" height="114" rx="8" fill="#FAF5EA" stroke="#D9A65B" stroke-width="1.5"/>
  <text x="209" y="272" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="17" font-weight="700" fill="#3C4459">(1 + i) = (1 + r) × (1 + π)</text>
  <text x="209" y="302" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="15" font-weight="700" fill="#8B5E1A">r = [ (1 + i) / (1 + π) ] − 1</text>
  <text x="209" y="332" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#252B39">i = taxa nominal · r = juro real · π = inflação (IPCA)</text>

  <rect x="394" y="242" width="320" height="114" rx="8" fill="#3C4459"/>
  <text x="412" y="268" font-family="Jura, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#E2BB7F">EXEMPLO NUMÉRICO VERIFICADO:</text>
  <text x="412" y="290" font-family="Jura, 'Segoe UI', sans-serif" font-size="11.5" fill="#F5E6C7">• Selic Nominal (i) = 15,00% a.a. | IPCA (π) = 4,26%</text>
  <text x="412" y="311" font-family="Jura, 'Segoe UI', sans-serif" font-size="11.5" fill="#F5E6C7">• Aproximação ingênua (i − π): 10,74%</text>
  <text x="412" y="334" font-family="Jura, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#E2BB7F">• Juro Real Exato: (1,15 / 1,0426) − 1 = 10,30% a.a.</text>
</svg>