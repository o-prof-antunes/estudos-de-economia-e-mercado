<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="title-fig10 desc-fig10">
  <title id="title-fig10">Fluxo de Análise de Cenários Econômicos ao Planejamento Empresarial</title>
  <desc id="desc-fig10">Ciclo de coleta de dados oficiais (IBGE, BCB, IPEA), construção de matriz de cenários (Otimista, Base, Estresse) e decisão gerencial.</desc>
  <rect width="760" height="400" rx="12" fill="#FAF5EA" stroke="#D8C9AA" stroke-width="1.5"/>
  <rect x="0" y="0" width="760" height="48" rx="12" fill="#3C4459"/>
  <rect x="0" y="34" width="760" height="14" fill="#3C4459"/>
  <text x="24" y="30" font-family="Jura, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#F5E6C7">FIGURA 10 · DA COLETA DE DADOS AO PLANEJAMENTO POR CENÁRIOS</text>

  <!-- Stage 1 -->
  <rect x="26" y="74" width="212" height="296" rx="10" fill="#FFFFFF" stroke="#0D91D0" stroke-width="2"/>
  <rect x="26" y="74" width="212" height="40" rx="10" fill="#0D91D0"/>
  <rect x="26" y="100" width="212" height="14" fill="#0D91D0"/>
  <text x="132" y="99" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">ETAPA 1 · FONTES PRIMÁRIAS</text>
  <text x="42" y="140" font-family="Jura, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#3C4459">• IBGE (SIDRA / Ag. Notícias)</text>
  <text x="42" y="156" font-family="Jura, 'Segoe UI', sans-serif" font-size="10.5" fill="#252B39">PIB trimestral, IPCA, INPC, PNAD</text>
  <text x="42" y="185" font-family="Jura, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#3C4459">• Banco Central (SGS / Focus)</text>
  <text x="42" y="201" font-family="Jura, 'Segoe UI', sans-serif" font-size="10.5" fill="#252B39">Selic, Câmbio PTAX, Crédito, Focus</text>
  <text x="42" y="230" font-family="Jura, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#3C4459">• IPEA / MTE / FGV</text>
  <text x="42" y="246" font-family="Jura, 'Segoe UI', sans-serif" font-size="10.5" fill="#252B39">Ipeadata, Novo Caged, IGP-M, ICC</text>
  <rect x="42" y="274" width="180" height="76" rx="8" fill="#FAF5EA" stroke="#D8C9AA"/>
  <text x="132" y="297" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#8B5E1A">Regra Técnica:</text>
  <text x="132" y="314" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="10.5" fill="#252B39">Sempre registre período,</text>
  <text x="132" y="329" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="10.5" fill="#252B39">unidade (% ou R$) e fonte ABNT</text>

  <!-- Arrow 1->2 -->
  <line x1="242" y1="222" x2="266" y2="222" stroke="#3C4459" stroke-width="3"/>
  <polygon points="274,222 263,216 263,228" fill="#3C4459"/>

  <!-- Stage 2 -->
  <rect x="276" y="74" width="212" height="296" rx="10" fill="#FFFFFF" stroke="#8B5E1A" stroke-width="2"/>
  <rect x="276" y="74" width="212" height="40" rx="10" fill="#8B5E1A"/>
  <rect x="276" y="100" width="212" height="14" fill="#8B5E1A"/>
  <text x="382" y="99" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#FFFFFF">ETAPA 2 · MATRIZ DE CENÁRIOS</text>

  <rect x="292" y="132" width="180" height="68" rx="8" fill="#FAF5EA" stroke="#0D91D0" stroke-width="1.5"/>
  <text x="382" y="154" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#3C4459">Cenário Otimista</text>
  <text x="382" y="172" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="9.5" fill="#252B39">PIB acima da meta · Selic em queda</text>
  <text x="382" y="187" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="9.5" fill="#252B39">Expansão de estoque e CAPEX</text>

  <rect x="292" y="210" width="180" height="68" rx="8" fill="#F5E6C7" stroke="#8B5E1A" stroke-width="1.5"/>
  <text x="382" y="232" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#3C4459">Cenário Base (Mediana Focus)</text>
  <text x="382" y="250" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="9.8" fill="#252B39">Orçamento oficial da empresa</text>
  <text x="382" y="265" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="9.8" fill="#252B39">Repasse gradual de custos (IPCA)</text>

  <rect x="292" y="288" width="180" height="68" rx="8" fill="#FDF3F2" stroke="#9B2C2C" stroke-width="1.5"/>
  <text x="382" y="310" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#9B2C2C">Cenário Estresse / Conservador</text>
  <text x="382" y="328" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="9.8" fill="#252B39">Choque cambial/juros · Proteção de</text>
  <text x="382" y="343" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="9.8" fill="#252B39">caixa e corte de dívida cara</text>

  <!-- Arrow 2->3 -->
  <line x1="492" y1="222" x2="516" y2="222" stroke="#3C4459" stroke-width="3"/>
  <polygon points="524,222 513,216 513,228" fill="#3C4459"/>

  <!-- Stage 3 -->
  <rect x="526" y="74" width="208" height="296" rx="10" fill="#252B39"/>
  <text x="630" y="101" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="12.5" font-weight="700" fill="#E2BB7F">ETAPA 3 · DECISÃO GERENCIAL</text>
  <line x1="544" y1="115" x2="716" y2="115" stroke="#3C4459" stroke-width="1.5"/>
  <text x="544" y="143" font-family="Jura, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#F5E6C7">1. Precificação &amp; Margem:</text>
  <text x="544" y="159" font-family="Jura, 'Segoe UI', sans-serif" font-size="10.5" fill="#FAF5EA">Ajustar repasse pela elasticidade</text>
  <text x="544" y="190" font-family="Jura, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#F5E6C7">2. Compras &amp; Estoques:</text>
  <text x="544" y="206" font-family="Jura, 'Segoe UI', sans-serif" font-size="10.5" fill="#FAF5EA">Giro rápido sob Selic restritiva</text>
  <text x="544" y="237" font-family="Jura, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#F5E6C7">3. Crédito &amp; Prazos:</text>
  <text x="544" y="253" font-family="Jura, 'Segoe UI', sans-serif" font-size="10.5" fill="#FAF5EA">Alinhar PMR e PMP ao custo do CDI</text>
  <text x="544" y="284" font-family="Jura, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#F5E6C7">4. Relatório Executivo:</text>
  <text x="544" y="300" font-family="Jura, 'Segoe UI', sans-serif" font-size="10.5" fill="#FAF5EA">Entregar parecer claro à diretoria</text>
  <text x="544" y="340" font-family="Jura, 'Segoe UI', sans-serif" font-size="10.5" font-weight="700" fill="#E2BB7F">Competência 1 + Habilidades 1.1–1.3</text>
</svg>