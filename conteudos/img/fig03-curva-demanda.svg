  <line x1="555" y1="140" x2="695" y2="270" stroke="#0D91D0" stroke-width="3.5"/>
  <text x="698" y="270" font-family="Jura, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#0D91D0">D₁</text>

