  <line x1="585" y1="215" x2="625" y2="215" stroke="#0D91D0" stroke-width="2.2"/>
  <polygon points="632,215 622,211 622,219" fill="#0D91D0"/>
  <line x1="555" y1="225" x2="520" y2="225" stroke="#9B2C2C" stroke-width="2.2"/>
