<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="title-fig03 desc-fig03">
  <title id="title-fig03">Curva de Demanda: Movimento ao Longo vs. Deslocamentos</title>
  <desc id="desc-fig03">Comparação entre variação na quantidade demandada pelo preço e deslocamento da curva de demanda por mudança de renda, gostos ou preços relacionados.</desc>
  <rect width="760" height="400" rx="12" fill="#FAF5EA" stroke="#D8C9AA" stroke-width="1.5"/>
  <rect x="0" y="0" width="760" height="48" rx="12" fill="#3C4459"/>
  <rect x="0" y="34" width="760" height="14" fill="#3C4459"/>
  <text x="24" y="30" font-family="Jura, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#F5E6C7">FIGURA 03 · CURVA DE DEMANDA: VARIAÇÃO DE PREÇO × DESLOCAMENTO</text>

  <!-- Panel Left -->
  <rect x="24" y="66" width="346" height="310" rx="10" fill="#FFFFFF" stroke="#D8C9AA" stroke-width="1.2"/>
  <text x="197" y="92" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#3C4459">A) Movimento ao longo da Curva D</text>
  <text x="197" y="109" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#595856">Somente o PREÇO do próprio bem varia (ceteris paribus)</text>

  <line x1="72" y1="322" x2="72" y2="128" stroke="#252B39" stroke-width="2"/>
  <polygon points="72,122 68,132 76,132" fill="#252B39"/>
  <line x1="72" y1="322" x2="335" y2="322" stroke="#252B39" stroke-width="2"/>
  <polygon points="342,322 332,318 332,326" fill="#252B39"/>
  <text x="58" y="135" font-family="Jura, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#252B39">P</text>
  <text x="336" y="340" font-family="Jura, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#252B39">Qd</text>

  <line x1="110" y1="150" x2="305" y2="295" stroke="#0D91D0" stroke-width="3.5" stroke-linecap="round"/>
  <text x="310" y="295" font-family="Jura, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#0D91D0">D</text>

  <!-- Point A & B -->
  <line x1="72" y1="185" x2="157" y2="185" stroke="#8B5E1A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="157" y1="185" x2="157" y2="322" stroke="#8B5E1A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="72" y1="255" x2="251" y2="255" stroke="#8B5E1A" stroke-width="1.2" stroke-dasharray="4 3"/>
  <line x1="251" y1="255" x2="251" y2="322" stroke="#8B5E1A" stroke-width="1.2" stroke-dasharray="4 3"/>

  <circle cx="157" cy="185" r="5.5" fill="#3C4459" stroke="#FFF" stroke-width="1.5"/>
  <circle cx="251" cy="255" r="5.5" fill="#8B5E1A" stroke="#FFF" stroke-width="1.5"/>
  <text x="52" y="189" text-anchor="end" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#3C4459">P₁</text>
  <text x="52" y="259" text-anchor="end" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#8B5E1A">P₂</text>
  <text x="157" y="339" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#3C4459">Q₁</text>
  <text x="251" y="339" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#8B5E1A">Q₂</text>
  <line x1="173" y1="190" x2="232" y2="234" stroke="#9B2C2C" stroke-width="2.2"/>
  <polygon points="238,239 227,236 232,228" fill="#9B2C2C"/>
  <text x="208" y="200" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#3C4459">P↓ ⇒ Qd↑</text>

  <!-- Panel Right -->
  <rect x="390" y="66" width="346" height="310" rx="10" fill="#FFFFFF" stroke="#D8C9AA" stroke-width="1.2"/>
  <text x="563" y="92" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="13.5" font-weight="700" fill="#3C4459">B) Deslocamento da Curva Inteira</text>
  <text x="563" y="109" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#595856">Mudam renda, preferências ou preço de bens relacionados</text>

