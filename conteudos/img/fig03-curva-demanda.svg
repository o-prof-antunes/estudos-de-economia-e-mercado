  <text x="563" y="361" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#252B39">D₀ → D₁ Expansão (↑ Renda / ↑ Substituto) · D₀ → D₂ Contração</text>
