<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 400" width="760" height="400" role="img" aria-labelledby="title-fig05 desc-fig05">
  <title id="title-fig05">Equilíbrio de Mercado e Desequilíbrios de Preço</title>
  <desc id="desc-fig05">Interseção das curvas de demanda e oferta definindo preço e quantidade de equilíbrio, excesso de oferta acima do equilíbrio e excesso de demanda abaixo.</desc>
  <rect width="760" height="400" rx="12" fill="#FAF5EA" stroke="#D8C9AA" stroke-width="1.5"/>
  <rect x="0" y="0" width="760" height="48" rx="12" fill="#3C4459"/>
  <rect x="0" y="34" width="760" height="14" fill="#3C4459"/>
  <text x="24" y="30" font-family="Jura, 'Segoe UI', sans-serif" font-size="16" font-weight="700" fill="#F5E6C7">FIGURA 05 · EQUILÍBRIO DE MERCADO (Qd = Qo) E AJUSTE DE PREÇOS</text>

  <!-- Axes -->
  <line x1="95" y1="340" x2="95" y2="75" stroke="#252B39" stroke-width="2.5"/>
  <polygon points="95,68 90,80 100,80" fill="#252B39"/>
  <line x1="95" y1="340" x2="475" y2="340" stroke="#252B39" stroke-width="2.5"/>
  <polygon points="483,340 471,335 471,345" fill="#252B39"/>
  <text x="106" y="79" font-family="Jura, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#252B39">Preço (P)</text>
  <text x="455" y="365" font-family="Jura, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#252B39">Quantidade (Q)</text>

  <!-- Excess Supply zone (above Pe=210, P_alto=135) -->
  <polygon points="285,210 185,135 385,135" fill="#8B5E1A" fill-opacity="0.14"/>
  <!-- Excess Demand zone (below Pe=210, P_baixo=285) -->
  <polygon points="285,210 185,285 385,285" fill="#9B2C2C" fill-opacity="0.14"/>

  <!-- Curves -->
  <line x1="145" y1="105" x2="425" y2="315" stroke="#0D91D0" stroke-width="3.8" stroke-linecap="round"/>
  <text x="430" y="317" font-family="Jura, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#0D91D0">Demanda (D)</text>

  <line x1="145" y1="315" x2="425" y2="105" stroke="#3C4459" stroke-width="3.8" stroke-linecap="round"/>
  <text x="430" y="108" font-family="Jura, 'Segoe UI', sans-serif" font-size="14" font-weight="700" fill="#3C4459">Oferta (S)</text>

  <!-- Dashed lines -->
  <line x1="95" y1="135" x2="385" y2="135" stroke="#8B5E1A" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="95" y1="210" x2="285" y2="210" stroke="#252B39" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="285" y1="210" x2="285" y2="340" stroke="#252B39" stroke-width="1.5" stroke-dasharray="5 4"/>
  <line x1="95" y1="285" x2="385" y2="285" stroke="#9B2C2C" stroke-width="1.5" stroke-dasharray="5 4"/>

  <!-- Equilibrium Point E -->
  <circle cx="285" cy="210" r="7" fill="#D9A65B" stroke="#252B39" stroke-width="2.5"/>
  <text x="298" y="214" font-family="Jura, 'Segoe UI', sans-serif" font-size="13" font-weight="700" fill="#252B39">E (Pe, Qe)</text>

  <!-- Axis labels -->
  <text x="88" y="139" text-anchor="end" font-family="Jura, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#8B5E1A">P alto</text>
  <text x="88" y="214" text-anchor="end" font-family="Jura, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#252B39">Pe</text>
  <text x="88" y="289" text-anchor="end" font-family="Jura, 'Segoe UI', sans-serif" font-size="11.5" font-weight="700" fill="#9B2C2C">P baixo</text>
  <text x="285" y="357" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#252B39">Qe</text>

  <!-- Zone texts -->
  <text x="285" y="128" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#8B5E1A">EXCESSO DE OFERTA (Qo &gt; Qd)</text>
  <text x="285" y="302" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" font-weight="700" fill="#9B2C2C">EXCESSO DE DEMANDA (Qd &gt; Qo)</text>

  <!-- Right Panel Summary -->
  <rect x="520" y="75" width="218" height="280" rx="10" fill="#FFFFFF" stroke="#D8C9AA" stroke-width="1.2"/>
  <rect x="520" y="75" width="218" height="34" rx="10" fill="#252B39"/>
  <rect x="520" y="96" width="218" height="13" fill="#252B39"/>
  <text x="629" y="97" text-anchor="middle" font-family="Jura, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#E2BB7F">DECISÃO NO VAREJO / INDÚSTRIA</text>

  <text x="534" y="132" font-family="Jura, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#8B5E1A">1. Preço acima de Pe:</text>
  <text x="534" y="149" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#252B39">Sobra mercadoria no estoque.</text>
  <text x="534" y="164" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#252B39">Gera promoções e queda de P</text>
  <text x="534" y="179" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#252B39">até retornar a Pe.</text>

  <line x1="534" y1="194" x2="724" y2="194" stroke="#E6DEC8" stroke-width="1"/>
  <text x="534" y="214" font-family="Jura, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#3C4459">2. No Equilíbrio E (Pe, Qe):</text>
  <text x="534" y="231" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#252B39">Tudo o que se deseja comprar</text>
  <text x="534" y="246" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#252B39">ao preço Pe é ofertado.</text>

  <line x1="534" y1="261" x2="724" y2="261" stroke="#E6DEC8" stroke-width="1"/>
  <text x="534" y="281" font-family="Jura, 'Segoe UI', sans-serif" font-size="12" font-weight="700" fill="#9B2C2C">3. Preço abaixo de Pe:</text>
  <text x="534" y="298" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#252B39">Falta produto e surgem filas;</text>
  <text x="534" y="313" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#252B39">pressão compradora eleva</text>
  <text x="534" y="328" font-family="Jura, 'Segoe UI', sans-serif" font-size="11" fill="#252B39">o preço de volta para Pe.</text>
</svg>